<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic AI Skill & CV Matcher</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #f8fafc; color: #0f172a; padding: 24px; }
    .container { max-width: 1200px; margin: 0 auto; }
    
    .header { margin-bottom: 20px; }
    .header h1 { font-size: 24px; font-weight: 700; }
    .header p { color: #64748b; font-size: 14px; }

    .panel { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 24px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 11px; font-weight: 700; color: #475569; text-transform: uppercase; }
    .field input, .field textarea, .field select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; outline: none; }

    .btn-run { background: #4f46e5; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; }
    .btn-run:hover { background: #4338ca; }
    .btn-run:disabled { background: #94a3b8; }

    .layout { display: grid; grid-template-columns: 1fr 1.2fr; gap: 24px; align-items: start; }
    .job-list { display: flex; flex-direction: column; gap: 14px; max-height: 800px; overflow-y: auto; }
    
    .job-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px; cursor: pointer; transition: all 0.2s; }
    .job-card:hover, .job-card.active { border-color: #4f46e5; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.08); }
    
    .card-title { font-size: 16px; font-weight: 700; color: #0f172a; }
    .card-company { font-size: 13px; color: #64748b; margin-bottom: 8px; }
    
    .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .chip-match { background: #dcfce7; color: #166534; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .chip-none { background: #f1f5f9; color: #64748b; padding: 3px 8px; border-radius: 12px; font-size: 11px; }

    .score-badge { font-size: 14px; font-weight: 800; padding: 4px 10px; border-radius: 16px; }
    .high-score { background: #dcfce7; color: #15803d; }
    .mid-score { background: #fef9c3; color: #854d0e; }
    .low-score { background: #f1f5f9; color: #64748b; }

    .detail-panel { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; position: sticky; top: 24px; }
    .desc-box { font-size: 13px; line-height: 1.6; color: #334155; max-height: 400px; overflow-y: auto; background: #f8fafc; padding: 12px; border-radius: 8px; margin-top: 12px; white-space: pre-wrap; }
    
    .status-msg { text-align: center; padding: 40px; color: #64748b; font-size: 14px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🎯 Dynamic CV & Job Description Matcher</h1>
      <p>Extracts real terms directly from your CV and compares them live against scraped job postings.</p>
    </div>

    <div class="panel">
      <div class="grid-2">
        <div class="field">
          <label>Job Title Search Query</label>
          <input type="text" id="roleInput" value="Operations Manager OR Project Manager">
        </div>
        <div class="field">
          <label>Location</label>
          <input type="text" id="locInput" value="Portugal">
        </div>
      </div>

      <div class="field">
        <label>📄 Upload PDF CV or Paste Resume Skills</label>
        <input type="file" id="cvFile" accept=".pdf,.txt" onchange="readCVFile(event)" style="margin-bottom:8px;">
        <textarea id="cvText" rows="3" placeholder="Paste or upload your CV here..."></textarea>
      </div>

      <button id="searchBtn" class="btn-run" style="margin-top:12px;" onclick="searchAndMatch()">🔍 Scrape Jobs & Perform Real Match Analysis</button>
    </div>

    <div class="layout">
      <div class="job-list" id="jobList">
        <div class="status-msg">Click <strong>Scrape Jobs & Perform Real Match Analysis</strong> to start.</div>
      </div>

      <div class="detail-panel" id="detailPanel">
        <div class="status-msg">👈 Select a job from the list to view the full native description and exact matched skills.</div>
      </div>
    </div>
  </div>

  <script>
    const API_TOKEN = "apify_api_XZ7BbAkRfm3AulbaMb1TZw0Z8gTJgl04mQnl";
    const ACTOR_ID = "DYFzkdbYmMF6x7QMG";

    let fetchedJobs = [];

    // Parse PDF CV using PDF.js
    async function readCVFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      if (file.type === "application/pdf") {
        const reader = new FileReader();
        reader.onload = async function() {
          const typedarray = new Uint8Array(this.result);
          pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
          const pdf = await pdfjsLib.getDocument(typedarray).promise;
          let text = "";
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            text += content.items.map(item => item.str).join(" ") + " ";
          }
          document.getElementById('cvText').value = text;
        };
        reader.readAsArrayBuffer(file);
      } else {
        const reader = new FileReader();
        reader.onload = ev => document.getElementById('cvText').value = ev.target.result;
        reader.readAsText(file);
      }
    }

    // Dynamic Skill Extractor (No hardcoded skills)
    function extractCVTerms(rawCV) {
      if (!rawCV || rawCV.trim().length === 0) return [];

      // Clean text into meaningful unique terms (words > 3 characters, removing common stop words)
      const stopWords = new Set(["with", "from", "that", "this", "have", "been", "were", "their", "about", "which", "will", "would", "there", "their", "management", "experience"]);
      
      const words = rawCV.toLowerCase()
        .replace(/[^a-z0-9\s]/g, ' ')
        .split(/\s+/)
        .filter(w => w.length > 3 && !stopWords.has(w));

      return Array.from(new Set(words));
    }

    function calculateRealMatch(cvTerms, jobDesc) {
      if (!cvTerms || cvTerms.length === 0 || !jobDesc) {
        return { score: 0, matched: [] };
      }

      const descLower = jobDesc.toLowerCase();
      const matched = [];

      cvTerms.forEach(term => {
        if (descLower.includes(term)) {
          // Capitalize term for clean display
          matched.push(term.charAt(0).toUpperCase() + term.slice(1));
        }
      });

      // Calculate true percentage match based on overlap ratio
      const matchRatio = matched.length / Math.min(cvTerms.length, 30);
      const score = Math.min(Math.round(matchRatio * 100), 98);

      return { score, matched };
    }

    async function searchAndMatch() {
      const role = document.getElementById('roleInput').value;
      const location = document.getElementById('locInput').value;
      const cvRaw = document.getElementById('cvText').value;
      const btn = document.getElementById('searchBtn');
      const list = document.getElementById('jobList');

      const userCVTerms = extractCVTerms(cvRaw);

      btn.disabled = true;
      list.innerHTML = `<div class="status-msg">🚀 Scraping live jobs on Apify Cloud...</div>`;

      try {
        const payload = {
          searchTerm: role,
          location: location,
          sites: ["linkedin", "indeed", "glassdoor"],
          maxResults: 15
        };

        const startRes = await fetch(`https://api.apify.com/v2/acts/${ACTOR_ID}/runs?token=${API_TOKEN}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const startData = await startRes.json();
        const runId = startData.data.id;
        const datasetId = startData.data.defaultDatasetId;

        let finished = false;
        let attempts = 0;
        while (!finished && attempts < 35) {
          attempts++;
          list.innerHTML = `<div class="status-msg">⏳ Analyzing live job postings against your CV... (${attempts * 3}s)</div>`;
          await new Promise(r => setTimeout(r, 3000));

          const checkRes = await fetch(`https://api.apify.com/v2/actor-runs/${runId}?token=${API_TOKEN}`);
          const checkData = await checkRes.json();
          if (checkData.data.status === 'SUCCEEDED') finished = true;
        }

        const datasetRes = await fetch(`https://api.apify.com/v2/datasets/${datasetId}/items?token=${API_TOKEN}`);
        fetchedJobs = await datasetRes.json();

        if (!fetchedJobs || fetchedJobs.length === 0) {
          list.innerHTML = `<div class="status-msg">No live jobs found for this query.</div>`;
          btn.disabled = false;
          return;
        }

        list.innerHTML = '';
        fetchedJobs.forEach((job, index) => {
          const fullDesc = job.description || job.snippet || job.title;
          const matchResult = calculateRealMatch(userCVTerms, fullDesc);

          let badgeClass = "low-score";
          if (matchResult.score >= 60) badgeClass = "high-score";
          else if (matchResult.score >= 30) badgeClass = "mid-score";

          list.innerHTML += `
            <div class="job-card" id="card-${index}" onclick="showDetail(${index})">
              <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                <div>
                  <div class="card-title">${job.title || 'Job Title'}</div>
                  <div class="card-company">${job.company || 'Company'} — 📍 ${job.location || location}</div>
                </div>
                <div class="score-badge ${badgeClass}">${matchResult.score}%</div>
              </div>

              <div class="chips">
                ${matchResult.matched.length > 0 
                  ? matchResult.matched.slice(0, 5).map(m => `<span class="chip-match">✓ ${m}</span>`).join('') 
                  : '<span class="chip-none">No direct skill overlap detected</span>'}
              </div>
            </div>
          `;
        });

        showDetail(0);

      } catch (err) {
        list.innerHTML = `<div class="status-msg" style="color:red;">❌ Error: ${err.message}</div>`;
      } finally {
        btn.disabled = false;
      }
    }

    function showDetail(index) {
      document.querySelectorAll('.job-card').forEach(c => c.classList.remove('active'));
      const card = document.getElementById(`card-${index}`);
      if (card) card.classList.add('active');

      const job = fetchedJobs[index];
      const cvRaw = document.getElementById('cvText').value;
      const userCVTerms = extractCVTerms(cvRaw);
      
      const fullDesc = job.description || job.snippet || "Full description available on original portal.";
      const matchResult = calculateRealMatch(userCVTerms, fullDesc);

      const panel = document.getElementById('detailPanel');
      panel.innerHTML = `
        <div style="font-size:12px; font-weight:600; color:#6366f1;">Sourced from ${job.site || 'Portal'}</div>
        <div style="font-size:20px; font-weight:700; color:#0f172a;">${job.title || 'Job Title'}</div>
        <div style="font-size:14px; font-weight:500; color:#475569; margin-bottom:12px;">${job.company || 'Company'}</div>

        <div style="background:#f8fafc; padding:12px; border-radius:8px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-size:16px; font-weight:800;">${matchResult.score}% True Match Score</div>
            <div style="font-size:12px; color:#166534;">${matchResult.matched.length} actual keywords overlapped with your CV</div>
          </div>
          <div class="score-badge high-score">${matchResult.score}%</div>
        </div>

        <div style="margin-bottom:12px;">
          <strong style="font-size:12px;">Matched Terms:</strong>
          <div class="chips">
            ${matchResult.matched.length > 0 
              ? matchResult.matched.map(m => `<span class="chip-match">✓ ${m}</span>`).join('') 
              : '<span class="chip-none">Upload your CV above to see dynamic matches!</span>'}
          </div>
        </div>

        <strong style="font-size:12px;">Job Description (Native Text):</strong>
        <div class="desc-box">${fullDesc}</div>

        <a href="${job.jobUrl || job.url || job.link || '#'}" target="_blank" style="display:block; text-align:center; background:#0f172a; color:white; text-decoration:none; padding:10px; border-radius:8px; font-weight:600; font-size:13px; margin-top:16px;">View Original Posting ↗</a>
      `;
    }
  </script>
</body>
</html>
