<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Tracker & Google Sign-In</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Google Identity Services Library -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #f8fafc; color: #0f172a; padding: 24px; }
    .container { max-width: 1250px; margin: 0 auto; }

    /* Top Bar with Login & Tracker Stats */
    .top-bar { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px 24px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
    .user-profile { display: flex; align-items: center; gap: 12px; }
    .user-avatar { width: 38px; height: 38px; border-radius: 50%; border: 2px solid #4f46e5; }
    
    .stats-container { display: flex; gap: 16px; }
    .stat-card { background: #f1f5f9; padding: 8px 16px; border-radius: 8px; text-align: center; }
    .stat-num { font-size: 18px; font-weight: 800; color: #4f46e5; }
    .stat-label { font-size: 11px; font-weight: 600; color: #64748b; text-transform: uppercase; }

    /* Search Control Panel */
    .filter-panel { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 24px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 14px; }
    .field-group { display: flex; flex-direction: column; gap: 4px; }
    .field-group label { font-size: 11px; font-weight: 700; color: #475569; text-transform: uppercase; }
    .field-group input, .field-group select { padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; outline: none; }

    .btn-search { background: #4f46e5; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 12px; }

    /* Main Grid Layout */
    .main-layout { display: grid; grid-template-columns: 1fr 1.25fr; gap: 24px; align-items: start; }
    @media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; } }

    .job-list { display: flex; flex-direction: column; gap: 14px; max-height: 850px; overflow-y: auto; }
    
    /* Job Card with Applied YES/NO Toggle */
    .job-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px; position: relative; transition: all 0.2s; }
    .job-card.applied { border-left: 5px solid #16a34a; background: #f0fdf4; }
    
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .job-card-title { font-size: 17px; font-weight: 700; color: #0f172a; }
    .job-card-company { font-size: 13px; color: #475569; margin-bottom: 10px; }

    /* Applied Toggle Switch */
    .apply-toggle-box { display: flex; align-items: center; gap: 8px; background: #ffffff; padding: 6px 12px; border-radius: 20px; border: 1px solid #cbd5e1; font-size: 12px; font-weight: 700; }
    .btn-toggle { padding: 4px 10px; border-radius: 14px; border: none; font-size: 11px; font-weight: 700; cursor: pointer; }
    .btn-yes { background: #dcfce7; color: #15803d; }
    .btn-no { background: #f1f5f9; color: #64748b; }

    .detail-view { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; position: sticky; top: 24px; }
    .desc-box { font-size: 13px; line-height: 1.6; color: #334155; max-height: 450px; overflow-y: auto; margin-top: 12px; white-space: pre-wrap; background: #f8fafc; padding: 12px; border-radius: 8px; }
    
    .btn-apply { display: block; width: 100%; text-align: center; background: #0f172a; color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 14px; margin-top: 16px; }

    .status-msg { text-align: center; padding: 40px; color: #64748b; font-size: 14px; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Top Header & Google Sign-In Bar -->
    <div class="top-bar">
      <div>
        <h1 style="font-size:20px; font-weight:700;">🌐 Job Tracker Suite</h1>
        <p style="font-size:12px; color:#64748b;">Manage applications & track applied roles in real-time.</p>
      </div>

      <!-- Real-Time Tracker Stats -->
      <div class="stats-container">
        <div class="stat-card">
          <div class="stat-num" id="statApplied">0</div>
          <div class="stat-label">Jobs Applied</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="statTotal">0</div>
          <div class="stat-label">Total Found</div>
        </div>
      </div>

      <!-- Google Sign In Container -->
      <div id="googleAuthSection">
        <div id="g_id_onload"
             data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
             data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin" data-type="standard"></div>
      </div>

      <!-- User Profile Info (Hidden until signed in) -->
      <div id="userInfo" class="user-profile" style="display:none;">
        <img id="userImg" class="user-avatar" src="" alt="Profile">
        <div>
          <div id="userName" style="font-size:13px; font-weight:700;"></div>
          <div id="userEmail" style="font-size:11px; color:#64748b;"></div>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="filter-panel">
      <div class="grid-3">
        <div class="field-group">
          <label>Job Title Search</label>
          <input type="text" id="roleInput" placeholder="e.g. Operations Manager">
        </div>

        <div class="field-group">
          <label>Location</label>
          <input type="text" id="locInput" placeholder="e.g. Portugal or Worldwide">
        </div>

        <div class="field-group">
          <label>Date Posted</label>
          <select id="dateFilter">
            <option value="pastWeek" selected>Past 7 Days</option>
            <option value="past24h">Past 24 Hours</option>
            <option value="pastMonth">Past 30 Days</option>
          </select>
        </div>
      </div>

      <button id="searchBtn" class="btn-search" onclick="runLiveSearch()">🔍 Scrape Jobs & Start Tracking</button>
    </div>

    <!-- Main Results Layout -->
    <div class="main-layout">
      <div class="job-list" id="jobList">
        <div class="status-msg">Search above to fetch live job listings.</div>
      </div>

      <div class="detail-view" id="detailView">
        <div style="text-align:center; padding: 60px 0; color: #94a3b8;">
          👈 Select a job to view its description and update application status.
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_TOKEN = "apify_api_XZ7BbAkRfm3AulbaMb1TZw0Z8gTJgl04mQnl";
    const ACTOR_ID = "DYFzkdbYmMF6x7QMG";

    let currentJobs = [];
    let appliedJobs = new Set(); // Stores IDs or titles of applied jobs

    // Handle Google Sign-In JWT Payload
    function handleCredentialResponse(response) {
      const responsePayload = parseJwt(response.credential);
      
      document.getElementById('googleAuthSection').style.display = 'none';
      document.getElementById('userInfo').style.display = 'flex';
      
      document.getElementById('userName').innerText = responsePayload.name;
      document.getElementById('userEmail').innerText = responsePayload.email;
      document.getElementById('userImg').src = responsePayload.picture;
    }

    function parseJwt(token) {
      var base64Url = token.split('.')[1];
      var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    // Toggle Applied Status (YES / NO)
    function toggleApplied(index, status) {
      const job = currentJobs[index];
      const jobKey = job.jobUrl || job.title;

      if (status === 'YES') {
        appliedJobs.add(jobKey);
      } else {
        appliedJobs.delete(jobKey);
      }

      updateStats();
      renderJobList();
      renderDetailView(index);
    }

    function updateStats() {
      document.getElementById('statApplied').innerText = appliedJobs.size;
      document.getElementById('statTotal').innerText = currentJobs.length;
    }

    async function runLiveSearch() {
      const role = document.getElementById('roleInput').value.trim();
      const location = document.getElementById('locInput').value.trim();
      const datePosted = document.getElementById('dateFilter').value;
      const btn = document.getElementById('searchBtn');
      const listContainer = document.getElementById('jobList');

      if (!role) {
        alert("Please enter a job title to search!");
        return;
      }

      btn.disabled = true;
      listContainer.innerHTML = `<div class="status-msg">🚀 Fetching live vacancies...</div>`;

      try {
        const payload = {
          searchTerm: role,
          location: location || undefined,
          datePosted: datePosted,
          sites: ["linkedin", "indeed", "glassdoor"],
          maxResults: 30
        };

        const startRes = await fetch(`https://api.apify.com/v2/acts/${ACTOR_ID}/runs?token=${API_TOKEN}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const startData = await startRes.json();
        const runId = startData.data.id;
        const datasetId = startData.data.defaultDatasetId;

        let isFinished = false;
        let attempts = 0;
        while (!isFinished && attempts < 35) {
          attempts++;
          listContainer.innerHTML = `<div class="status-msg">⏳ Scraping active portals... (${attempts * 3}s)</div>`;
          await new Promise(r => setTimeout(r, 3000));

          const checkRes = await fetch(`https://api.apify.com/v2/actor-runs/${runId}?token=${API_TOKEN}`);
          const checkData = await checkRes.json();
          if (checkData.data.status === 'SUCCEEDED') isFinished = true;
        }

        const datasetRes = await fetch(`https://api.apify.com/v2/datasets/${datasetId}/items?token=${API_TOKEN}`);
        currentJobs = await datasetRes.json();

        updateStats();
        renderJobList();
        renderDetailView(0);

      } catch (err) {
        listContainer.innerHTML = `<div class="status-msg" style="color:red;">❌ Error: ${err.message}</div>`;
      } finally {
        btn.disabled = false;
      }
    }

    function renderJobList() {
      const listContainer = document.getElementById('jobList');
      listContainer.innerHTML = '';

      currentJobs.forEach((job, index) => {
        const jobKey = job.jobUrl || job.title;
        const isApplied = appliedJobs.has(jobKey);

        listContainer.innerHTML += `
          <div class="job-card ${isApplied ? 'applied' : ''}" onclick="renderDetailView(${index})">
            <div class="card-top">
              <div>
                <div class="job-card-title">${job.title || 'Job Role'}</div>
                <div class="job-card-company">${job.company || 'Company'} — 📍 ${job.location || 'Location'}</div>
              </div>

              <!-- APPLIED YES / NO TOGGLE -->
              <div class="apply-toggle-box" onclick="event.stopPropagation();">
                <span>Applied?</span>
                <button class="btn-toggle ${isApplied ? 'btn-yes' : 'btn-no'}" onclick="toggleApplied(${index}, 'YES')">YES</button>
                <button class="btn-toggle ${!isApplied ? 'btn-yes' : 'btn-no'}" onclick="toggleApplied(${index}, 'NO')">NO</button>
              </div>
            </div>

            <div style="font-size:11px; font-weight:600; color:#6366f1; margin-top:6px;">
              Sourced from ${job.site || 'LinkedIn'} ${isApplied ? '• ✅ Tracked in Applied List' : ''}
            </div>
          </div>
        `;
      });
    }

    function renderDetailView(index) {
      const job = currentJobs[index];
      if (!job) return;

      const jobKey = job.jobUrl || job.title;
      const isApplied = appliedJobs.has(jobKey);
      const targetUrl = job.jobUrl || job.url || job.link || '#';

      const detailContainer = document.getElementById('detailView');
      detailContainer.innerHTML = `
        <div style="font-size:12px; font-weight:600; color:#6366f1;">Sourced from ${job.site || 'LinkedIn'}</div>
        <div style="font-size:20px; font-weight:700; color:#0f172a; margin-top:2px;">${job.title}</div>
        <div style="font-size:14px; font-weight:500; color:#475569; margin-bottom:12px;">${job.company} — 📍 ${job.location || 'Location'}</div>

        <div style="background:${isApplied ? '#dcfce7' : '#f8fafc'}; padding:12px; border-radius:8px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-size:14px; font-weight:700; color:${isApplied ? '#166534' : '#0f172a'};">
              ${isApplied ? '✅ Application Status: APPLIED' : '⏳ Application Status: NOT YET APPLIED'}
            </div>
          </div>
          <button style="padding:6px 12px; font-size:12px; font-weight:700; border-radius:8px; border:none; cursor:pointer; background:${isApplied ? '#166534' : '#0f172a'}; color:white;"
                  onclick="toggleApplied(${index}, '${isApplied ? 'NO' : 'YES'}')">
            Mark as ${isApplied ? 'Not Applied' : 'Applied'}
          </button>
        </div>

        <h3 style="font-size:13px; font-weight:700; color:#0f172a;">Job Description</h3>
        <div class="desc-box">${job.description || job.snippet || 'Description available on portal.'}</div>

        <a href="${targetUrl}" target="_blank" class="btn-apply">View Original Job on ${job.site || 'Portal'} ↗</a>
      `;
    }
  </script>
</body>
</html>
